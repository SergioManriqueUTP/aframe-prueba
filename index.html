<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Animación A-Frame</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
  <a-scene>

    <!-- Esfera animada -->
    <a-sphere 
      position="0 1.25 -5" 
      radius="1.25" 
      color="#EF2D5E"
      animation="property: position; to: 0 2 -5; dir: alternate; dur: 1000; loop: true">
    </a-sphere>

    <!-- Caja girando -->
    <a-box 
      position="-1 0.5 -3" 
      color="#4CC3D9"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 2000">
    </a-box>

    <a-plane 
      position="0 0 -4" 
      rotation="-90 0 0" 
      width="4" 
      height="4" 
      color="#7BC8A4">
    </a-plane>

    <a-sky color="#ECECEC"></a-sky>

  </a-scene>
</body>
</html>
