<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Robot 3D</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>

<a-scene>

  <a-assets>
    <a-asset-item id="robot" src="Robot.glb"></a-asset-item>
  </a-assets>

  <a-entity 
    gltf-model="#robot"
    position="0 0 -5"
    scale="0.01 0.01 0.01">
  </a-entity>

  <a-sky color="#ECECEC"></a-sky>

</a-scene>

</body>
</html>
