<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Joystick A-Frame</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-virtual-joystick/dist/aframe-virtual-joystick.min.js"></script>

</head>
<body>

<a-scene>

  <!-- Jugador con joystick -->
  <a-entity id="rig" position="0 0 0" virtual-joystick>

    <!-- Cámara -->
    <a-entity camera look-controls position="0 1.6 0"></a-entity>

  </a-entity>

  <!-- Escenario -->
  <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
  <a-box position="0 0.5 -3" color="#4CC3D9"></a-box>
  <a-sky color="#ECECEC"></a-sky>

</a-scene>

</body>
</html>
